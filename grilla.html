<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Palmar · Disponibilidad</title>
<style>
:root{
 --verde:#0e2924; --verde2:#12352b; --verde3:#1d4c3f; --dorado:#c89333; --dorado2:#d8ab4e;
 --crema:#f4eede; --papel:#ffffff; --tinta:#20302b; --gris:#7c8a83; --linea:#e9e5da;
 --libre:#2f8f4e; --librebg:#eaf6ee; --rojo:#b23b3b; --sombra:0 6px 20px rgba(14,41,36,.08);
 --sans:"Segoe UI",Roboto,Arial,Helvetica,sans-serif; --serif:Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eef1ee;font-family:var(--sans);color:var(--tinta);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 50px}

.top{background:linear-gradient(120deg,var(--verde) 0%,var(--verde3) 100%);color:var(--crema);
 border-bottom:4px solid var(--dorado);position:sticky;top:0;z-index:20;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.top .in{max-width:1100px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:48px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.top .ti{flex:1;min-width:150px}
.top h1{font-family:var(--serif);font-size:19px;letter-spacing:2px;font-weight:700}
.top .sub{font-size:11px;color:var(--dorado2);letter-spacing:1px;margin-top:2px}
.top .upd{font-size:11px;color:#bcd;opacity:.85}
.btn-ref{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--crema);
 border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:600}

.ctrl{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);margin:16px 0;padding:12px 14px;
 display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ctrl .grp{display:flex;flex-direction:column;gap:4px}
.ctrl label{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);font-weight:700}
.ctrl select,.ctrl input[type=date]{border:1.5px solid var(--linea);border-radius:9px;padding:9px 11px;font-size:14px;
 background:#fff;color:var(--tinta);font-family:inherit;min-width:150px}
.ctrl select:focus,.ctrl input:focus{outline:none;border-color:var(--dorado)}
.nav{display:flex;gap:6px}
.nav button{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:9px 13px;font-size:15px;cursor:pointer;color:var(--verde);font-weight:700}
.nav button:hover{border-color:var(--dorado)}
.nav .hoy{font-size:12px;letter-spacing:.5px}

.head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;flex-wrap:wrap;gap:8px}
.head .dia{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--verde);text-transform:capitalize}
.head .cta{font-size:12px;color:var(--gris)}
.head .cta b{color:var(--verde)}
.leg{display:flex;gap:12px;font-size:11px;color:var(--gris);align-items:center;flex-wrap:wrap}
.leg span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.dot.libre{background:var(--librebg);border:1px solid #bfe0c9}
.dot.t-fijo{background:linear-gradient(120deg,var(--verde),var(--verde3))}
.dot.t-even{background:linear-gradient(120deg,#8a3f1c,#b5652f)}
.dot.t-esc{background:linear-gradient(120deg,#234e77,#2e6ba3)}
.dot.t-tor{background:linear-gradient(120deg,#4a2f6b,#6b4a8f)}

/* PLANILLA en columnas */
.tablewrap{overflow-x:auto;border-radius:12px}
table.pl{width:100%;border-collapse:separate;border-spacing:5px;min-width:340px}
.pl thead th{background:var(--verde);color:var(--crema);font-family:var(--serif);font-size:13px;font-weight:700;
 padding:9px 8px;border-radius:9px;text-align:center;letter-spacing:.3px;white-space:nowrap}
.pl thead th.hcol{background:transparent;color:var(--gris);font-family:var(--sans);font-size:10px;
 text-transform:uppercase;letter-spacing:.6px;width:96px}
.pl td.hora{font-size:12.5px;font-weight:800;color:var(--verde);white-space:nowrap;text-align:right;
 padding:0 10px 0 4px;width:96px;letter-spacing:.2px}
.pl td.slot{border-radius:10px;padding:0;height:52px;box-shadow:var(--sombra);vertical-align:middle;text-align:center;position:relative}
.pl td.slot .cli{font-weight:700;font-size:13px;color:#fff;padding:0 8px;line-height:1.15;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* libre (clickable = reservar) */
.pl td.libre{background:var(--librebg);border:1px solid #bfe0c9}
.pl td.libre a.reservar{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
 text-decoration:none;color:var(--libre);font-weight:700;font-size:12.5px;border-radius:10px;transition:background .15s}
.pl td.libre a.reservar:hover{background:#dbefe1}
.pl td.pasado{background:#f1f2f1;border:1px dashed #dfe3df}
.pl td.pasado .pas{display:flex;align-items:center;justify-content:center;height:100%;color:#c3ccc5;font-size:16px;font-weight:700}
.pl td.libre a.reservar .plus{opacity:.55;font-weight:800;margin-right:4px}
/* ocupado por tipo de cliente */
.pl td.ocu{border:1px solid transparent}
.pl td.ocu a.det{display:block;width:100%;height:100%;text-decoration:none;color:inherit;border-radius:10px}
.pl td.ocu a.det:hover{filter:brightness(1.12)}
.pl td.ocu .cont{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;padding:6px 4px;cursor:pointer}
.pl td.ocu.t-fijo{background:linear-gradient(120deg,var(--verde) 0%,var(--verde3) 100%)}
.pl td.ocu.t-even{background:linear-gradient(120deg,#8a3f1c 0%,#b5652f 100%)}
.pl td.ocu.t-esc{background:linear-gradient(120deg,#234e77 0%,#2e6ba3 100%)}
.pl td.ocu.t-tor{background:linear-gradient(120deg,#4a2f6b 0%,#6b4a8f 100%)}
.est{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.est.res{background:#f0ead6;color:#8a6a17} .est.sena{background:var(--dorado);color:#3a2a06} .est.pag{background:#cdeecd;color:#1c5c2e}

#msg{text-align:center;color:var(--gris);padding:30px;font-size:14px}
.foot{text-align:center;color:var(--gris);font-size:11px;margin-top:22px;letter-spacing:.5px}
.foot b{color:var(--verde)}
#load{position:fixed;inset:0;background:linear-gradient(135deg,var(--verde) 0%,var(--verde3) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50}
#load img{height:84px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));animation:pulse 1.6s ease-in-out infinite}
#load .lt{color:var(--crema);font-family:var(--serif);font-size:20px;letter-spacing:3px;font-weight:700}
#load .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--dorado);border-radius:50%;animation:spin .8s linear infinite}
#load .t{color:var(--dorado2);font-family:var(--sans);letter-spacing:1px;font-size:13px}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
#okmodal{position:fixed;inset:0;background:rgba(14,41,36,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}
#okmodal.show{display:flex}
#okmodal .mc{background:var(--papel);border-radius:16px;max-width:400px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.4);border-top:5px solid var(--dorado)}
#okmodal .mc-t{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--verde);text-align:center}
#okmodal .mc-t.err{color:var(--rojo)}
#okmodal .mc-s{font-size:14px;color:var(--tinta);text-align:center;margin-top:8px;line-height:1.45}
#okmodal .mc-steps{margin:16px 0 4px;padding-left:24px;display:flex;flex-direction:column;gap:9px}
#okmodal .mc-steps li{font-size:15px;line-height:1.4;color:var(--tinta)}
#okmodal .mc-steps li::marker{color:var(--dorado);font-weight:800}
#okmodal .mc-steps b{color:var(--verde)}
#okmodal .mc-btn{margin-top:18px;width:100%;background:linear-gradient(120deg,var(--verde) 0%,var(--verde3) 100%);color:var(--crema);border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.3px}
#okmodal .mc-btn:active{opacity:.9}
@media(max-width:520px){
 .pl thead th{font-size:12px;padding:7px 4px}
 .pl thead th.hcol,.pl td.hora{width:66px;font-size:11px}
 .pl td.slot .cli{font-size:11.5px}
 .top h1{font-size:16px}
}
</style></head>

<script>
const GAS="https://script.google.com/macros/s/AKfycbxYasftkvwQtwH1yp965tXuPn2TRlWg3EMJQ5HCggfAC0pukp_LdLSpbHTQp6lECN8w1Q/exec", CLAVE="elpalmar-panel-2026";
const DL_BASE="https://www.appsheet.com/start/a22d88b0-cdcd-45d7-8e60-73cd9a886c97?platform=desktop#appName=ElPalmar-97095589&group=&table=Turnos&view=Turnos_Form&row=&Cancha=";
const DL_DET="https://www.appsheet.com/start/a22d88b0-cdcd-45d7-8e60-73cd9a886c97?platform=desktop#appName=ElPalmar-97095589&group=&table=Turnos&view=Turnos_Detail&row=";
const FORM_URL="https://www.appsheet.com/start/a22d88b0-cdcd-45d7-8e60-73cd9a886c97?platform=desktop#appName=ElPalmar-97095589&group=&table=Turnos&view=Turnos_Form";
let DATA=null;
const $=id=>document.getElementById(id);

function jsonp(params){return new Promise((res,rej)=>{
 const cb="cb_"+Math.floor(Math.random()*1e9);
 window[cb]=d=>{res(d);delete window[cb];s.remove();};
 const s=document.createElement("script");
 s.onerror=()=>{rej("net");s.remove();};
 s.src=GAS+"?"+params+"&callback="+cb;
 document.body.appendChild(s);
});}

async function cargar(){
 try{
  const d=await jsonp("action=grilla&clave="+encodeURIComponent(CLAVE));
  if(!d||!d.ok){$("load").innerHTML='<div class="t" style="color:#f0b3b3">No se pudo cargar ('+((d&&d.error)||"error")+')</div>';return;}
  DATA=d; $("upd").textContent="Act. "+d.meta.generado;
  initTipos();
  if(!$("fFecha").value) $("fFecha").value=iso(new Date());
  render(); $("load").style.display="none";
 }catch(e){ $("load").innerHTML='<div class="t" style="color:#f0b3b3">Error de conexión</div>'; }
}
function recargar(){ $("load").style.display="flex"; cargar(); }

function norm(s){return (s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();}
function esPad(c){return /PAD/.test(norm(c.tipo))||/PAD/.test(norm(c.nombre));}
function esFut(c){return !esPad(c);}
function initTipos(){
 const s=$("fTipo"); s.innerHTML="";
 const hayFut=DATA.canchas.some(esFut), hayPad=DATA.canchas.some(c=>!esFut(c));
 if(hayFut){const o=document.createElement("option");o.value="FUTBOL";o.textContent="Fútbol";s.appendChild(o);}
 if(hayPad){const o=document.createElement("option");o.value="PADEL";o.textContent="Pádel";s.appendChild(o);}
}

function pad(n){return(""+n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function min(h){const m=(h||"").match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;}
function hhmm(m){return pad(Math.floor(m/60)%24)+":"+pad(m%60);}
function hhmmss(m){return pad(Math.floor(m/60)%24)+":"+pad(m%60)+":00";}
function mover(n){const v=$("fFecha").value; if(!v)return; const d=new Date(v+"T00:00:00"); d.setDate(d.getDate()+n); $("fFecha").value=iso(d); render();}
function hoy(){ $("fFecha").value=iso(new Date()); render(); }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function tipoCls(t){t=(t||"").toUpperCase();return t==="EVENTUAL"?"t-even":t==="ESCUELITA"?"t-esc":t==="TORNEO"?"t-tor":"t-fijo";}
function estPill(e){var m={"RESERVADO":"res","CON SEÑA":"sena","PAGADO":"pag"};if(!m[e])return"";return '<span class="est '+m[e]+'">'+e+'</span>';}
function linkReserva(cid,fecha,s){return DL_BASE+encodeURIComponent(cid)+"&Fecha="+fecha+"&Hora_Inicio="+hhmmss(s);}
function linkDetalle(id){return DL_DET+encodeURIComponent(id);}
function modal(html){ var m=$("okmodal"); m.querySelector(".mc-body").innerHTML=html; m.classList.add("show"); }
function cerrarModal(){ $("okmodal").classList.remove("show"); }
function esMobile(){ return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent||""); }
function pasosOK(){
 var pasos = esMobile()
  ? '<li><b>Cerrá</b> esta pantalla (la grilla).</li>'
   +'<li>Volvé a la app <b>El&nbsp;Palmar</b>.</li>'
   +'<li><b>Sincronizá</b>: deslizá la pantalla hacia abajo.</li>'
   +'<li>Tocá <b>«Nueva Reserva»</b> — ya va cargada.</li>'
  : '<li>Volvé a la pestaña de la app <b>El&nbsp;Palmar</b>.</li>'
   +'<li><b>Sincronizá</b> la app (botón ↻).</li>'
   +'<li>Tocá <b>«Nueva Reserva»</b> — ya va cargada.</li>';
 return '<div class="mc-t">✓ Datos guardados</div>'
   +'<div class="mc-s">Quedaron cargadas la cancha, la fecha y la hora. Para terminar la reserva:</div>'
   +'<ol class="mc-steps">'+pasos+'</ol>';
}
function reservar(cancha,fecha,hora,ev){
 if(ev) ev.preventDefault();
 modal('<div class="mc-t">Guardando…</div><div class="spin" style="margin:14px auto"></div>');
 jsonp("action=setctx&clave="+encodeURIComponent(CLAVE)+"&cancha="+encodeURIComponent(cancha)+"&fecha="+encodeURIComponent(fecha)+"&hora="+encodeURIComponent(hora))
  .then(function(r){ if(r&&r.ok){ modal(pasosOK()); } else { modal('<div class="mc-t err">No se pudo guardar</div><div class="mc-s">Reintentá en unos segundos.</div>'); } })
  .catch(function(){ modal('<div class="mc-t err">Sin conexión</div><div class="mc-s">Reintentá.</div>'); });
 return false;
}

function render(){
 if(!DATA)return;
 const tipo=$("fTipo").value, fecha=$("fFecha").value;
 if(!fecha)return;
 const canchas=DATA.canchas.filter(c=> tipo==="PADEL" ? !esFut(c) : esFut(c))
   .sort((a,b)=> (a.nombre||"")<(b.nombre||"")?-1:1);

 const d=new Date(fecha+"T00:00:00");
 $("dia").textContent=DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()];

 let ap=min(DATA.config.apertura), ci=min(DATA.config.cierre);
 if(ap===null)ap=480; if(ci===null||ci<=ap)ci=1440;
 const paso=(canchas[0]&&canchas[0].inc)||(tipo==="PADEL"?30:60);
 const slots=[]; for(let s=ap; s+paso<=ci; s+=paso) slots.push(s);

 // ocupación por cancha
 const occ={};
 canchas.forEach(c=>{
  const arr=new Array(slots.length).fill(null);
  DATA.turnos.filter(t=>t.cancha===c.id && t.f===fecha && !t.canc).forEach(t=>{
   const a=min(t.hi), b=min(t.hf); if(a===null||b===null)return;
   let si=-1, ei=-1;
   for(let i=0;i<slots.length;i++){const s=slots[i], e=s+paso; if(s<b && e>a){ if(si<0)si=i; ei=i; }}
   if(si<0)return;
   arr[si]={id:t.id, cli:t.cli, estado:t.estado, tipo:t.tipo, span:ei-si+1};
   for(let i=si+1;i<=ei;i++) arr[i]="cont";
  });
  occ[c.id]=arr;
 });

 const esHoy=(fecha===iso(new Date())); const _n=new Date(); const ahoraMin=_n.getHours()*60+_n.getMinutes();
 let libres=0, ocupados=0;
 let h='<table class="pl"><thead><tr><th class="hcol">Hora</th>';
 canchas.forEach(c=>{ h+='<th>'+esc(c.nombre)+'</th>'; });
 h+='</tr></thead><tbody>';
 for(let i=0;i<slots.length;i++){
  const s=slots[i], e=s+paso;
  h+='<tr><td class="hora">'+hhmm(s)+'<br>'+hhmm(e)+'</td>';
  canchas.forEach(c=>{
   const cell=occ[c.id][i];
   if(cell==="cont") return;               // cubierto por rowspan
   if(cell){ ocupados++;
    h+='<td class="slot ocu '+tipoCls(cell.tipo)+'" rowspan="'+cell.span+'"><div class="cont"><span class="cli">'+esc(cell.cli||"Ocupado")+'</span>'+estPill(cell.estado)+'</div></td>';
   }else if(esHoy && s < ahoraMin){ // franja que ya pasó hoy
    h+='<td class="slot pasado"><span class="pas">—</span></td>';
   }else{ libres++;
    h+='<td class="slot libre"><a class="reservar" href="javascript:void(0)" onclick="return reservar(\''+esc(c.id)+'\',\''+fecha+'\',\''+hhmmss(s)+'\',event)"><span class="plus">+</span>Reservar</a></td>';
   }
  });
  h+='</tr>';
 }
 h+='</tbody></table>';

 if(!canchas.length){ $("grid").innerHTML=""; $("msg").style.display="block"; $("msg").textContent="No hay canchas de este tipo."; }
 else{ $("grid").innerHTML=h; $("msg").style.display="none"; }
 $("resumen").innerHTML='<b>'+libres+'</b> espacios libres · <b>'+ocupados+'</b> ocupados';
}

cargar();
</script>
</body></html>
